<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>You're Offline — PeerConnect</title>
    <style>
        *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
        :root {
            --forest: #023047;
            --mint:   #0087CF;
            --bg:     #EDEDED;
            --gray-400: #9A9EA6;
            --gray-600: #565B66;
            --gray-900: #181D27;
        }
        body {
            font-family: system-ui, -apple-system, 'DM Sans', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--gray-900);
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 48px 40px;
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0,0,0,.08);
        }
        .icon-wrap {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #EAF6FB;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px;
        }
        .icon-wrap svg { width: 40px; height: 40px; stroke: var(--forest); fill: none; stroke-width: 1.8; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: var(--gray-900); }
        p  { font-size: 14px; color: var(--gray-600); line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--forest); color: white;
            border: none; border-radius: 10px;
            padding: 12px 24px; font-size: 14px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            font-family: inherit; transition: opacity .15s;
        }
        .btn:hover { opacity: .9; }
        .status {
            margin-top: 20px; font-size: 12px;
            color: var(--gray-400);
        }
        .online-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #dc2626;
            margin-right: 5px; vertical-align: middle;
            animation: pulse 2s infinite;
        }
        .online-dot.connected { background: #16a34a; animation: none; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        .cached-notice {
            background: #EAF6FB; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 20px;
            font-size: 13px; color: var(--mint);
            font-weight: 500; display: none;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 15.5A7.5 7.5 0 0 1 10.5 8h3A7.5 7.5 0 0 1 21 15.5"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 19a6 6 0 0 1 12 0"/>
            <line x1="2" y1="2" x2="22" y2="22" stroke-linecap="round"/>
        </svg>
    </div>

    <h1>You're Offline</h1>
    <p>PeerConnect couldn't load this page because you appear to be offline. Check your connection and try again.</p>

    <div class="cached-notice" id="cachedNotice">
        📦 Some pages may still be available from cache — try navigating back.
    </div>

    <button class="btn" onclick="retry()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5M4 9a9 9 0 0 1 15-5.66M20 15a9 9 0 0 1-15 5.66"/>
        </svg>
        Try Again
    </button>

    <p class="status">
        <span class="online-dot" id="dot"></span>
        <span id="statusText">No internet connection</span>
    </p>
</div>

<script>
function retry() {
    window.location.reload();
}

function updateStatus() {
    const dot  = document.getElementById('dot');
    const text = document.getElementById('statusText');
    if (navigator.onLine) {
        dot.classList.add('connected');
        text.textContent = 'Connection restored — reloading…';
        setTimeout(() => window.location.reload(), 1200);
    } else {
        dot.classList.remove('connected');
        text.textContent = 'No internet connection';
    }
}

// Show cached-pages notice if service worker has caches
if ('caches' in window) {
    caches.keys().then(keys => {
        if (keys.length > 0) document.getElementById('cachedNotice').style.display = 'block';
    });
}

window.addEventListener('online',  updateStatus);
window.addEventListener('offline', updateStatus);
updateStatus();
</script>
</body>
</html>
